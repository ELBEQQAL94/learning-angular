<button (click)="toggle()">Increment</button>
<p>{{ conditionalCount() }}</p>
<div class="grid grid-cols-[1fr_4fr] h-screen">
  <div class="h-full overflow-y-auto border-r border-gray-200">
    <app-chat-list></app-chat-list>
  </div>
  <div class="h-full grid grid-rows-[1fr_auto]">
    @if (isChatOpen()) {
      <app-chat-template />
    } @else {
      <app-default-chat-message />
    }
  </div>
</div>
